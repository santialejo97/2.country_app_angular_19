<section class="mx-10">
  <h1 class="text-3xl font-bold">{{ country().name }}</h1>
  <div class="flex gap-3 items-center">
    <span class="text-xl">{{ country().region }}</span>
    <span class="text-secondary">{{ country().subRegion }}</span>
  </div>
  <div class="divider"></div>
  <div class="stats bg-base-100 border border-base-300">
    <div class="stat">
      <div class="flex gap-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          viewBox="0 0 24 24"
        >
          <g fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14.5 4.5a2.5 2.5 0 1 1-5 0a2.5 2.5 0 0 1 5 0Z" />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m3 17l2.589-1.308A.75.75 0 0 0 6 15.02c0-2.94 2.138-5.454 5.007-5.937a6 6 0 0 1 1.986 0C15.863 9.566 18 12.08 18 15.02c0 .284.16.545.411.672L21 17"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m9.5 16l-1.042 1.389l-.063.084a2 2 0 0 1-1.034.686l-.102.026l-1.485.371A2.34 2.34 0 0 0 4 20.83c0 .646.524 1.17 1.171 1.17h1.556c.6 0 .9 0 1.19-.034a5 5 0 0 0 1.929-.643c.253-.147.493-.327.972-.687L11 20.5m0 0l2-1.5m-2 1.5l2.54.952c.61.229.914.343 1.229.417q.245.057.493.09c.321.041.647.041 1.298.041h2.269A1.17 1.17 0 0 0 20 20.829a2.34 2.34 0 0 0-1.774-2.273l-1.485-.37l-.102-.027a2 2 0 0 1-1.034-.686l-.063-.084L14.5 16"
            />
          </g>
        </svg>
        <div class="stat-title">Population</div>
      </div>
      <div class="stat-value">{{ country().population | number }}</div>
    </div>
    <div class="stat">
      <div class="flex gap-1">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="30"
          height="30"
          viewBox="0 0 24 24"
        >
          <path
            fill="currentColor"
            d="M8.308 17.692h.884v-5h3l1 2h4.5V9.308h-2.884l-1-2h-5.5zM12.003 21q-1.866 0-3.51-.708q-1.643-.709-2.859-1.924t-1.925-2.856T3 12.003t.709-3.51Q4.417 6.85 5.63 5.634t2.857-1.925T11.997 3t3.51.709q1.643.708 2.859 1.922t1.925 2.857t.709 3.509t-.708 3.51t-1.924 2.859t-2.856 1.925t-3.509.709"
          />
        </svg>
        <div class="stat-title">independent</div>
      </div>
      <div class="stat-value">
        @if (country().independent) {
        <span class="badge badge-outline badge-primary">independent</span>
        }@else {
        <span class="badge badge-outline badge-error">dictatorship</span>
        }
      </div>
    </div>
    <div class="stat">
      <div class="flex gap-1">
        <div class="stat-title">Icon</div>
      </div>
      <div class="stat-value">
        <span>{{ country().flag }}</span>
      </div>
    </div>
  </div>
</section>

<section class="mx-10 m-5 rounded">
  <figure class="diff aspect-16/9" tabindex="0">
    <div class="diff-item-1" role="img">
      <img [alt]="country().name" [src]="country().flagSvg" />
    </div>
    <div class="diff-item-2" role="img" tabindex="0">
      <img
        [alt]="country().name"
        [src]="country().flagSvg"
        class="blur brightness-75"
      />
    </div>
    <div class="diff-resizer"></div>
  </figure>
</section>
