<section class="flex flex-row gap-2 mt-2">
  <input
    type="text"
    class="input input-bordered mr-2 w-56"
    [placeholder]="this.placeholder()"
    autofocus
    (keyup.enter)="this.onSearchCapital(txtCapital.value)"
    #txtCapital
  />
  <button
    class="btn btn-primary"
    (click)="this.onSearchCapital(txtCapital.value)"
  >
    Search
  </button>
</section>
